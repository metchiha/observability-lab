global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape the FastAPI /metrics endpoint
  - job_name: "devops-lab-api"
    static_configs:
      - targets: ["app:8000"]   # local dev — "app" is the service name in docker-compose
      - targets: ["5.161.250.79:8001"]   # production deployment
    metrics_path: "/metrics"

  # Scrape the OTel Collector's own metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
